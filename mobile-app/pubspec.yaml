name: servio_mobile_app
description: SERVIO mobile application — mirrors the web frontend for customer & technician flows.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  geolocator: ^13.0.2
  permission_handler: ^12.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  http_parser: ^4.0.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
          weight: 700
dependency_overrides:
  intl: ^0.20.2
