version = 1

exclude_patterns = [
  ".agent/**",
  ".claude/**",
  ".github/**",
  ".idea/**",
  ".vscode/**",
  "**/node_modules/**",
  "ai-service/**",
  "docs/**",
  "mobile-app/**",
]

test_patterns = [
  "**/test/**",
  "**/*.test.js",
  "**/*.spec.js",
]

[[analyzers]]
name = "javascript"
enabled = true
