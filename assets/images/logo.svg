<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Badge background gradient -->
    <linearGradient id="servio-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3C2415"/>
      <stop offset="100%" stop-color="#1E2229"/>
    </linearGradient>
    <!-- Roof shimmer gradient -->
    <linearGradient id="servio-roof" x1="9" y1="21" x2="31" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8A7C65"/>
      <stop offset="100%" stop-color="#C4B49A"/>
    </linearGradient>
    <!-- Door gradient -->
    <linearGradient id="servio-door" x1="17" y1="24" x2="23" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3C2415"/>
      <stop offset="100%" stop-color="#2A1E14"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect width="40" height="40" rx="11" fill="url(#servio-bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="10.4"
        stroke="rgba(154,140,115,0.18)" stroke-width="1.5"/>

  <!-- ── House mark ── -->

  <!-- Roof chevron (gold gradient triangle) -->
  <path d="M 20,8.5 L 31.5,21 L 8.5,21 Z" fill="url(#servio-roof)"/>

  <!-- Roof ridge highlight line -->
  <line x1="20" y1="8.5" x2="20" y2="10.5"
        stroke="#D4C4A8" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- House body (white) -->
  <rect x="11.5" y="21" width="17" height="11.5" rx="1.2" fill="#F5F0EC"/>

  <!-- Left window -->
  <rect x="13.5" y="23" width="4.5" height="3.5" rx="1" fill="url(#servio-roof)" opacity="0.85"/>
  <!-- Window cross (left) -->
  <line x1="15.75" y1="23" x2="15.75" y2="26.5" stroke="white" stroke-width="0.7" opacity="0.6"/>
  <line x1="13.5" y1="24.75" x2="18" y2="24.75" stroke="white" stroke-width="0.7" opacity="0.6"/>

  <!-- Right window -->
  <rect x="22" y="23" width="4.5" height="3.5" rx="1" fill="url(#servio-roof)" opacity="0.85"/>
  <!-- Window cross (right) -->
  <line x1="24.25" y1="23" x2="24.25" y2="26.5" stroke="white" stroke-width="0.7" opacity="0.6"/>
  <line x1="22" y1="24.75" x2="26.5" y2="24.75" stroke="white" stroke-width="0.7" opacity="0.6"/>

  <!-- Door -->
  <rect x="17.5" y="25.5" width="5" height="7" rx="1.2" fill="url(#servio-door)"/>
  <!-- Door knob -->
  <circle cx="21.2" cy="29" r="0.7" fill="#9A8C73" opacity="0.9"/>

  <!-- Ground line (subtle base) -->
  <line x1="11.5" y1="32.5" x2="28.5" y2="32.5"
        stroke="rgba(154,140,115,0.30)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
